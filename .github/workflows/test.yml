name: Unit test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Không cần `npm install`: cả hai bộ test chỉ import module trong repo và
      # `node:assert`, không đụng tới node_modules. Engine cố tình không phụ thuộc
      # Electron — đó là lý do nó test được ở đây trên Linux.
      - run: npm test
