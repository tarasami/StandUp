name: Unit test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No `npm install` needed: both test suites import only modules from this repo
      # plus `node:assert`, never touching node_modules. The engine deliberately has no
      # Electron dependency — which is why it can be tested here on Linux.
      - run: npm test
