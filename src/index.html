<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>StandUp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="main">
  <header>
    <div class="header-text">
      <h1>🧍 StandUp</h1>
      <p class="sub">Nhắc bạn đứng dậy vận động khi ngồi quá lâu</p>
    </div>
    <button id="btn-settings" class="gear" aria-label="Cài đặt" title="Cài đặt">⚙</button>
  </header>

  <section class="card status">
    <div id="phase-label" class="phase">Đang làm việc</div>
    <div id="countdown" class="countdown">--:--</div>
    <div id="phase-hint" class="hint">đến lần nhắc tiếp theo</div>
  </section>

  <section class="controls">
    <button id="btn-test" class="btn">🔔 Thử nhắc ngay</button>
    <button id="btn-pause" class="btn">⏸ Tạm dừng</button>
  </section>

  <section id="settings-panel" class="card hidden">
    <h2>⚙️ Cài đặt</h2>
    <label>Nhắc sau mỗi (phút)
      <input id="in-interval" type="number" min="5" max="240" />
    </label>
    <label>Thời gian nghỉ (phút)
      <input id="in-break" type="number" min="1" max="60" />
    </label>
    <label>Coi là rời máy sau (phút)
      <input id="in-idle" type="number" min="1" max="60" />
    </label>
    <label>Vị trí cửa sổ nhắc
      <select id="in-position">
        <option value="bottom-right">Góc dưới-phải</option>
        <option value="center">Giữa màn hình</option>
      </select>
    </label>
    <label class="check">
      <input id="in-sound" type="checkbox" />
      <span>Phát âm báo nhẹ khi nhắc</span>
    </label>
    <label class="check">
      <input id="in-autostart" type="checkbox" />
      <span>Khởi động cùng Windows <em id="autostart-note"></em></span>
    </label>
    <label class="check stack">
      <input id="in-defer-fullscreen" type="checkbox" />
      <span>Tạm ẩn lời nhắc khi toàn màn hình
        <em class="sub">Xem phim, chơi game hay trình chiếu thì hoãn tới khi bạn xong</em>
      </span>
    </label>
    <button id="btn-save" class="btn primary block">Lưu cài đặt</button>
    <div id="save-msg" class="save-msg"></div>
  </section>

  <footer>Đóng cửa sổ này, app vẫn chạy trong khay hệ thống</footer>

  <script src="main.js"></script>
</body>
</html>
